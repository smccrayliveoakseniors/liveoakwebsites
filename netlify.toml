[build]
  publish = "sites/denison"

# ---------------------------------------------------------------------------
# Canonical URLs: https://liveoakdenison.com, extension-less paths (/about).
# Netlify serves /about from about.html automatically; the rules below 301
# the duplicate variants (http://, www, /about.html, /index.html) to that form.
# Also confirm "Force HTTPS" is enabled in Netlify > Domain management > HTTPS.
# ---------------------------------------------------------------------------

# Force HTTPS (apex and www) onto the canonical apex host
[[redirects]]
  from = "http://liveoakdenison.com/*"
  to = "https://liveoakdenison.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.liveoakdenison.com/*"
  to = "https://liveoakdenison.com/:splat"
  status = 301
  force = true

# /index.html -> /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/assisted-living.html"
  to = "/assisted-living"
  status = 301
  force = true

[[redirects]]
  from = "/memory-care.html"
  to = "/memory-care"
  status = 301
  force = true

[[redirects]]
  from = "/floor-plans.html"
  to = "/floor-plans"
  status = 301
  force = true

[[redirects]]
  from = "/gallery.html"
  to = "/gallery"
  status = 301
  force = true

[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/stone-brook.html"
  to = "/stone-brook"
  status = 301
  force = true

[[redirects]]
  from = "/thanks.html"
  to = "/thanks"
  status = 301
  force = true

# Friendly aliases for people searching the former name
[[redirects]]
  from = "/stonebrook"
  to = "/stone-brook"
  status = 301

[[redirects]]
  from = "/stone-brook-assisted-living"
  to = "/stone-brook"
  status = 301
